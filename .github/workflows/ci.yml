name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Which hosted parts this push touches: a web or docs change must not restart the agents mid-session.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.f.outputs.server }}
      agents: ${{ steps.f.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|\.github/workflows/)'
          if files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null); then
            echo "$files"
            echo "server=$(echo "$files" | grep -qE "$shared|^server/|^Dockerfile$|^\.data/" && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "agents=$(echo "$files" | grep -qE "$shared|^agents/" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "agents=true" >> "$GITHUB_OUTPUT"
          fi

  # main only: build the API server image, push it, roll the one hosted instance.
  # GitHub signs in to Azure as a managed identity (OIDC, no stored secrets) limited to access-desk-rg.
  deploy:
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      id-token: write
      contents: read
    env:
      REGISTRY: accessdesk25fb09
      IMAGE: accessdesk25fb09.azurecr.io/access-desk-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: f8338d8f-2c77-41f9-9900-61e5f936ef33
          tenant-id: e85c5307-76b1-4c48-bc5d-e88373dda261
          subscription-id: b51a8b54-faeb-472e-9c39-bfa2094956a9
      - run: az acr login -n $REGISTRY
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
      - name: Roll the server
        run: az containerapp update -n access-desk-api -g access-desk-rg --image $IMAGE -o none

  # main only: the agents' image (Learning, Scoring, ExploitWatch, Access), one always-on replica.
  deploy-agents:
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-agents
    permissions:
      id-token: write
      contents: read
    env:
      REGISTRY: accessdesk25fb09
      IMAGE: accessdesk25fb09.azurecr.io/access-desk-agents:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: f8338d8f-2c77-41f9-9900-61e5f936ef33
          tenant-id: e85c5307-76b1-4c48-bc5d-e88373dda261
          subscription-id: b51a8b54-faeb-472e-9c39-bfa2094956a9
      - run: az acr login -n $REGISTRY
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
      - name: Roll the agents
        run: az containerapp update -n access-desk-agents -g access-desk-rg --image $IMAGE -o none
