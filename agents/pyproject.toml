[project]
name = "desk-agents"
version = "0.0.0"
description = "Credit analyst and access controller agents"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3.0",
  "droid-sdk>=0.5.0",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[project.scripts]
desk-agents = "desk_agents.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
